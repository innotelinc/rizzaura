# ──────────────────────────────────────────────────────────────────────────────
# Rizz Aura — Global Leaderboard Platform
#
# Every service runs in Docker. Nginx Proxy Manager is NOT started here — it
# runs outside this stack (usually on port 81) and is provisioned through its
# REST API by scripts/npm-proxy-hosts.py (run by setup.sh). Subdomains:
#
#   app.rizzaura.net        → app        (3010)
#   rankings.rizzaura.net   → rankings  (3011)
#   community.rizzaura.net  → community (3012)
#   admin.rizzaura.net      → admin     (3013)
#   api.rizzaura.net        → api       (8000)
#   auth.rizzaura.net       → authentik (9000)
# ──────────────────────────────────────────────────────────────────────────────
name: rizzaura

networks:
  rizz-net:
    driver: bridge

volumes:
  rizz-data: # api state (data/state.json)
  authentik_postgres:
  authentik_redis:
  authentik_media:
  authentik_templates:

services:
  # ── Platform API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: rizz-api
    restart: unless-stopped
    ports:
      - "8000:8000" # NPM proxy target (api.<domain>)
    environment:
      PORT: "8000"
      APP_URL: "${APP_URL:-https://app.rizzaura.net}"
      API_URL: "${API_URL:-https://api.rizzaura.net}"
      APP_ORIGINS: "${APP_ORIGINS:-https://app.rizzaura.net,https://rankings.rizzaura.net,https://community.rizzaura.net,https://admin.rizzaura.net}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me}"
      # Authentik SSO (auth.<domain>)
      AUTHENTIK_ISSUER: "${AUTHENTIK_ISSUER:-https://auth.rizzaura.net}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_ADMIN_GROUP: "${AUTHENTIK_ADMIN_GROUP:-rizz-aura-admins}"
      # Cash Shop (Stripe)
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      # AI achievement recommendations (OpenAI-compatible endpoint)
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
    volumes:
      - rizz-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8000/api/state'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rizz-net]

  # ── Frontend services (each its own SPA + nginx container) ────────────────
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.rizzaura.net}"
    container_name: rizz-app
    restart: unless-stopped
    ports:
      - "3010:3010"
    depends_on: [api]
    networks: [rizz-net]

  rankings:
    build:
      context: .
      dockerfile: apps/rankings/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.rizzaura.net}"
    container_name: rizz-rankings
    restart: unless-stopped
    ports:
      - "3011:3011"
    depends_on: [api]
    networks: [rizz-net]

  community:
    build:
      context: .
      dockerfile: apps/community/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.rizzaura.net}"
    container_name: rizz-community
    restart: unless-stopped
    ports:
      - "3012:3012"
    depends_on: [api]
    networks: [rizz-net]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.rizzaura.net}"
    container_name: rizz-admin
    restart: unless-stopped
    ports:
      - "3013:3013"
    depends_on: [api]
    networks: [rizz-net]

  # ── Authentik — identity provider + SSO (auth.<domain>) ───────────────────
  authentik-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD:?set AUTHENTIK_POSTGRES_PASSWORD in your .env}"
    volumes:
      - authentik_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [rizz-net]

  authentik-redis:
    image: docker.io/library/redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${AUTHENTIK_REDIS_PASSWORD:?set AUTHENTIK_REDIS_PASSWORD in your .env}",
      ]
    volumes:
      - authentik_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTHENTIK_REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [rizz-net]

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.6.3}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    ports:
      - "9000:9000" # NPM proxy target (auth.<domain>)
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in your .env}"
      AUTHENTIK_TOKEN: "${AUTHENTIK_TOKEN:?set AUTHENTIK_TOKEN in your .env}"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD:?}"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_REDIS__PASSWORD: "${AUTHENTIK_REDIS_PASSWORD:?}"
      AUTHENTIK_PUBLIC_URL: "${AUTHENTIK_PUBLIC_URL:-https://auth.rizzaura.net}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@rizzaura.net}"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD:-}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DEFAULT_TOKEN_LENGTH: "48"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      authentik-postgres: { condition: service_healthy }
      authentik-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/if/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [rizz-net]

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.6.3}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY:?}"
      AUTHENTIK_TOKEN: "${AUTHENTIK_TOKEN:?}"
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRES_PASSWORD:?}"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_REDIS__PASSWORD: "${AUTHENTIK_REDIS_PASSWORD:?}"
      AUTHENTIK_PUBLIC_URL: "${AUTHENTIK_PUBLIC_URL:-https://auth.rizzaura.net}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      authentik-postgres: { condition: service_healthy }
      authentik-redis: { condition: service_healthy }
    networks: [rizz-net]
