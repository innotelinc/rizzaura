# ──────────────────────────────────────────────────────────────────────────────
# Rizz Aura — Global Leaderboard Platform
#
# Every service runs in Docker. Nginx Proxy Manager is NOT started here — it
# runs outside this stack (usually on port 81) and is provisioned through its
# REST API by scripts/npm-proxy-hosts.py (run by setup.sh).
#
# The domain is fully customizable via BASE_DOMAIN in .env (default
# rizz.innotel.us; switch to rizzaura.net once DNS propagates). Every URL
# below derives from it:
#
#   app.<domain>        → app        (3010)
#   rankings.<domain>   → rankings  (3011)
#   community.<domain>  → community (3012)
#   admin.<domain>      → admin     (3013)
#   api.<domain>        → api       (8000)
#   auth.<domain>       → Cerulean Authentik (SSO)
#   (optional profile "ai": OmniRoute LLM API proxy on 20128 via Zeus)
# ──────────────────────────────────────────────────────────────────────────────
name: rizzaura

networks:
  rizz-net:
    driver: bridge

volumes:
  rizz-data: # api state (data/state.json)

services:
  # ── Platform API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: rizz-api
    restart: unless-stopped
    ports:
      - "8000:8000" # NPM proxy target (api.<domain>)
    environment:
      PORT: "8000"
      BASE_DOMAIN: "${BASE_DOMAIN:-rizz.innotel.us}"
      APP_URL: "${APP_URL:-https://app.${BASE_DOMAIN:-rizz.innotel.us}}"
      API_URL: "${API_URL:-https://api.${BASE_DOMAIN:-rizz.innotel.us}}"
      APP_ORIGINS: "${APP_ORIGINS:-https://app.${BASE_DOMAIN:-rizz.innotel.us},https://rankings.${BASE_DOMAIN:-rizz.innotel.us},https://community.${BASE_DOMAIN:-rizz.innotel.us},https://admin.${BASE_DOMAIN:-rizz.innotel.us}}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me}"
      # Authentik SSO (auth.<domain>)
      # Cash Shop — Magnate (RevenueOps) owns billing; Rizz Aura holds no
      # Stripe keys. MAGNATE_API_TOKEN must equal Magnate's
      # ENTITLEMENTS_API_TOKEN when Magnate gates its APIs.
      MAGNATE_PUBLIC_URL: "${MAGNATE_PUBLIC_URL:-https://app.magnate.innotel.us}"
      MAGNATE_API_TOKEN: "${MAGNATE_API_TOKEN:-}"
      MAGNATE_FULFILLMENT_SECRET: "${MAGNATE_FULFILLMENT_SECRET:-}"
      # AI achievement recommendations — OmniRoute (OpenAI-compatible LLM API
      # proxy, profile "ai" below) by default; any OpenAI-compatible endpoint
      # works (OpenAI, Groq, Together, Ollama, ...).
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
    volumes:
      - rizz-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8000/api/state'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rizz-net]

  # ── Frontend services (each its own SPA + nginx container) ────────────────
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.${BASE_DOMAIN:-rizz.innotel.us}}"
        VITE_BASE_DOMAIN: "${BASE_DOMAIN:-rizz.innotel.us}"
    container_name: rizz-app
    restart: unless-stopped
    ports:
      - "3010:3010"
    depends_on: [api]
    networks: [rizz-net]

  rankings:
    build:
      context: .
      dockerfile: apps/rankings/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.${BASE_DOMAIN:-rizz.innotel.us}}"
        VITE_BASE_DOMAIN: "${BASE_DOMAIN:-rizz.innotel.us}"
    container_name: rizz-rankings
    restart: unless-stopped
    ports:
      - "3011:3011"
    depends_on: [api]
    networks: [rizz-net]

  community:
    build:
      context: .
      dockerfile: apps/community/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.${BASE_DOMAIN:-rizz.innotel.us}}"
        VITE_BASE_DOMAIN: "${BASE_DOMAIN:-rizz.innotel.us}"
    container_name: rizz-community
    restart: unless-stopped
    ports:
      - "3012:3012"
    depends_on: [api]
    networks: [rizz-net]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.${BASE_DOMAIN:-rizz.innotel.us}}"
        VITE_BASE_DOMAIN: "${BASE_DOMAIN:-rizz.innotel.us}"
    container_name: rizz-admin
    restart: unless-stopped
    ports:
      - "3013:3013"
    depends_on: [api]
    networks: [rizz-net]

  # ── OmniRoute — self-hosted LLM API proxy for the AI recommendations ──────
  # OpenAI-compatible at http://omniroute:20128/v1. Opt-in via profile so the
  # default stack stays lean: `docker compose --profile ai up -d`. setup.sh
  # boots it when OMNIROUTE_INITIAL_PASSWORD is set and mints the API key.

  # ── Authentik — identity provider + SSO (auth.<domain>) ───────────────────



